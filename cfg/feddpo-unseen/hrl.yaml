use_gpu: True
device: 0  # Override in script
early_stop:
  patience: 0
federate:
  mode: standalone
  client_num: 20  # All 20 clients participate in evaluation
  total_round_num: 50
  save_to: "/hdd/hdd3/kjb/checkpoints/hhrl_rlhf_qwen2_feddpo_unseen.ckpt"  # Override in script
  save_freq: 20
  share_local_model: True
  online_aggr: False
data:
  root: /hdd/hdd3/kjb/
  type: 'hh-rlhf@llm'
  splits: [0.9,0.09,0.01]
  splitter: 'iid'
model:
  type: 'Qwen/Qwen2-0.5B@huggingface_llm'
llm:
  use: True
  rlhf: True
  tok_len: 1024
  max_new_token: 512
  num_completions: 2
  accelerator:
    use: False
  chat:
    max_len: 512
  adapter:
    use: True
    count: 3
    warmup:
      use: True
      round: 2
    grouping:
      use: False
      round: 2
    args: [ { 'adapter_package': 'peft', 'adapter_method': 'lora', 'r': 8, 'lora_alpha': 16, 'lora_dropout': 0.05 } ]
  reward_coeff: 0.1  # DPO beta parameter (temperature)
  grad_accum_step: 4
  max_prompts_for_generation: 50
  generation_batch_size: 3
expname: feddpo_unseen_hrl
trainer:
  type: llmdporewardtrainer
dataloader:
  batch_size: 1
  num_workers: 0
  pin_memory: True
train:
  local_update_steps: 30
  batch_or_epoch: batch
  optimizer:
    type: AdamW
    betas: (0.9, 0.95)
    lr: 0.0001
  is_enable_half: True
eval:
  freq: 5
  metrics: ['loss', 'acc']
  best_res_update_round_wise_key: train_avg_loss
  count_flops: False
wandb:
  use: True
  name_user: ''
  name_project: 'fvpl-unseen-rl'
  online_track: True
  client_train_info: True
