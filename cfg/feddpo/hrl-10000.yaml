use_gpu: True
device: 1  # GPU 1 for FedDPO HRL experiment (tid: 10000)
early_stop:
  patience: 0
federate:
  mode: standalone
  client_num: 1
  total_round_num: 30
  save_to: "/hdd/hdd3/kjb/checkpoints/hhrl_rlhf_gemma_choice_feddpo_10000.ckpt"
  save_freq: 50
  share_local_model: True
  online_aggr: False
data:
  root: /hdd/hdd3/kjb/
  type: 'hh-rlhf@llm'
  splits: [0.9,0.09,0.01]
  splitter: 'iid'
model:
  type: 'google/gemma-2b@huggingface_llm'
llm:
  use: True
  rlhf: True
  tok_len: 1024
  max_new_token: 512
  num_completions: 2
  metrics: ['loss', 'acc']
  best_res_update: False
  grad_accum_step: 32  # Gradient accumulation for effective batch size
  max_prompts_for_generation: 50  # Randomly sample 50 prompts per round
  generation_batch_size: 3  # Batch size for text generation
  # Federated Direct Preference Optimization (FedDPO) parameters for RLHF
  # FedDPO is pure DPO for federated learning (baseline)
  # WITHOUT VPL, GP prior, or orthogonal loss
  # Direct Preference Optimization: https://arxiv.org/abs/2305.18290
  reward_coeff: 0.1  # DPO beta parameter (temperature)
expname: hhrl/rlhf_gemma/hhrl_choice_gemma_fedbiscuit_u3_feddpo
trainer:
  type: llmdporewardtrainer  # Pure DPO trainer (no VPL)
dataloader:
  batch_size: 1  # Reduced to prevent OOM (effective batch size maintained via grad_accum_step=32)
train:
  local_update_steps: 10
  batch_or_epoch: batch
  optimizer:
    type: AdamW
    betas: (0.9, 0.95)
    lr: 0.0001
  is_enable_half: True
eval:
  freq: 1  # Evaluate every round
  metrics: ['loss', 'acc', 'avg_harmlessness', 'avg_helpfulness']
  count_flops: False
  max_samples_for_reward: 20
wandb:
  use: True
  name_user: ''
  name_project: 'vpl-gp-rl'  # RL project for comparison
  online_track: True
  client_train_info: True
