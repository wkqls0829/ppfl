use_gpu: True
device: 0  # SLURM sets CUDA_VISIBLE_DEVICES, so always use device 0
early_stop:
  patience: 0
federate:
  mode: standalone
  client_num: 10
  sample_client_num: 5
  total_round_num: 50  # Standard rounds for hhst training
  save_to: "/hdd/hdd3/kjb/checkpoints/final_hhrl_choice_gemma_feddpo.ckpt"
  ignore_weight: True
  save_freq: 50
  share_local_model: True
  online_aggr: False
data:
  root: /hdd/hdd3/kjb/
  type: 'hh-rlhf@llm'
  splits: [0.9,0.09,0.01]
  splitter: 'meta'
llm:
  use: True
  tok_len: 1024
  max_new_token: 512
  accelerator:
    use: False
  chat:
    max_len: 512
  adapter:
    use: True
    count: 3
    warmup:
      use: True
      round: 2
    grouping:
      use: False
      round: 2
    args: [ { 'adapter_package': 'peft', 'adapter_method': 'lora', 'r': 8, 'lora_alpha': 16, 'lora_dropout': 0.05 } ]
  # Federated Direct Preference Optimization (FedDPO) parameters
  # FedDPO is pure DPO for federated learning (baseline)
  # WITHOUT VPL, GP prior, or orthogonal loss
  # Direct Preference Optimization: https://arxiv.org/abs/2305.18290
  grad_accum_step: 4
dataloader:
  batch_size: 8
  num_workers: 0  # Set to 0 to avoid "Too many open files" error in cluster environment
  pin_memory: True
model:
  type: 'google/gemma-2b@huggingface_llm'
train:
  local_update_steps: 30
  batch_or_epoch: batch
  optimizer:
    type: AdamW
    betas: (0.9, 0.95)
    lr: 0.0001
  is_enable_half: True
criterion:
  type: CrossEntropyLoss
trainer:
  type: llmdporewardchoicetrainer
  choices: ['A', 'B']
eval:
  freq: 5
  metrics: ['loss', 'acc']
  best_res_update_round_wise_key: train_avg_loss
  count_flops: False
  max_samples_for_reward: 100
expname: hhrl/choice_gemma/feddpo
wandb:
  use: True
  name_user: ''
  name_project: 'fvpl-selector'
  online_track: True
  client_train_info: True
