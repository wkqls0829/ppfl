use_gpu: True
device: 0  # GPU 0 for FedVPL HRL experiment (tid: 31024) - using 30024 selector checkpoint
early_stop:
  patience: 0
federate:
  mode: standalone
  client_num: 1  # RL training uses single client (standalone RLHF)
  total_round_num: 50  # RL training rounds
  save_to: "/hdd/hdd3/kjb/checkpoints/hhrl_rlhf_gemma_choice_fedvpl_31024.ckpt"
  ignore_weight: True
  save_freq: 20  # Checkpoint 저장 빈도 줄여서 I/O 시간 감소
  share_local_model: True  # Single GPU mode
  online_aggr: False
data:
  root: /hdd/hdd3/kjb/
  type: 'hh-rlhf@llm'  # Using hh-rlhf dataset for RL training
  splits: [0.9,0.09,0.01]
  splitter: 'iid'  # RL training uses iid splitter
model:
  type: 'google/gemma-2b@huggingface_llm'
llm:
  use: True
  rlhf: True  # Enable RLHF training (DPO)
  tok_len: 1024
  max_new_token: 512
  num_completions: 2  # Number of completions to generate per prompt
  accelerator:
    use: False
  chat:
    max_len: 512
  adapter:
    use: True
    count: 3
    warmup:
      use: True
      round: 2
    grouping:
      use: False
      round: 2
    args: [ { 'adapter_package': 'peft', 'adapter_method': 'lora', 'r': 8, 'lora_alpha': 16, 'lora_dropout': 0.05 } ]
  # Federated Variational Preference Learning (FedVPL) parameters for RLHF
  # FedVPL is naive VPL for federated learning (baseline)
  # WITHOUT gradient prior (GP) or orthogonal loss
  # Based on: https://github.com/WEIRDLabUW/vpl
  # Following original VPL implementation: uses logits-based features (NOT embedding difference)
  vpl_use_gp_prior: False  # No GP prior (standard VPL, baseline)
  vpl_latent_dim: 32
  vpl_kl_weight: 0.1  # Same as 30024
  vpl_gp_temperature: 1.0
  vpl_feature_method: 'choice_logits'  # Original VPL uses logits at choice positions
  vpl_use_feature_difference: False  # Original VPL does NOT use embedding difference (baseline)
  vpl_max_logvar: -3.0  # Same as 30024 (tighter variance cap, sigma <= 0.223)
  # Orthogonal loss parameters (DISABLED for FedVPL baseline)
  vpl_orthogonal_weight: 0.0  # Orthogonal loss disabled
  vpl_orthogonal_orthonorm_weight: 0.0  # Orthonormal constraint disabled
  vpl_use_manual_orthogonal_labels: False  # Not needed when orthogonal loss is disabled
  vpl_num_prototypes: 0  # Not used when orthogonal loss is disabled
  vpl_prototype_scale: 0.0
  vpl_tsne_visualize_freq: 10  # Generate t-SNE visualization every 10 rounds
  # VPL-specific parameters for conditional generation in RLHF
  rlhf_use_variational_selection: True  # Use variational selection for pseudo-label generation
  rlhf_use_variational_generation: False  # FedVPL does not use z-dependent generation (baseline)
  rlhf_selector_checkpoint: "/hdd/hdd3/kjb/checkpoints/final_hhrl_choice_gemma_fedbiscuit_u3_fedvpl_30024.ckpt"  # Selector checkpoint path (will be overridden by selector_cfg_file)
  reward_coeff: 0.1  # DPO beta coefficient
  grad_accum_step: 4  # Gradient accumulation steps
  max_prompts_for_generation: 50  # Number of prompts to generate per round
  generation_batch_size: 3  # Batch size for text generation
dataloader:
  batch_size: 1  # Small batch size for RL training (effective batch size = batch_size * grad_accum_step = 1 * 4 = 4)
  num_workers: 4  # DataLoader 병렬화로 데이터 로딩 속도 향상
  pin_memory: True  # GPU 전송 속도 향상
train:
  local_update_steps: 30  # RL training steps per round
  batch_or_epoch: batch
  optimizer:
    type: AdamW
    betas: (0.9, 0.95)
    lr: 0.0001  # Same as 30024
  is_enable_half: True
criterion:
  type: CrossEntropyLoss
trainer:
  type: llmdporewardtrainer  # DPO trainer for RL training (not binary selector)
eval:
  freq: 10  # Evaluation 빈도
  metrics: ['loss', 'acc']  # Reward model evaluation disabled
  best_res_update_round_wise_key: train_avg_loss  # Use train_avg_loss instead of val_avg_loss
  count_flops: False
expname: fedvpl_hrl_t31024
wandb:
  use: True
  name_user: ''
  name_project: 'fvpl-rl'  # WandB project for RL experiments
  online_track: True
  client_train_info: True
