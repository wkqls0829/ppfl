use_gpu: True
device: 2
early_stop:
  patience: 0
federate:
  mode: standalone
  client_num: 10
  total_round_num: 50
  save_to: "/hdd/hdd3/kjb/checkpoints/hhrl_rlhf_qwen2_fedbiscuit_3070_t21100.ckpt"
  save_freq: 50
  share_local_model: True
  online_aggr: False
data:
  root: /hdd/hdd3/kjb/
  type: 'hh-rlhf@llm'
  splits: [0.9,0.09,0.01]
  splitter: 'iid'
  meta_split_clients_per_cat: [3, 7]
model:
  type: 'Qwen/Qwen2-0.5B@huggingface_llm'
llm:
  use: True
  rlhf: True
  tok_len: 1024
  max_new_token: 512
  num_completions: 2
  best_res_update: False
  grad_accum_step: 32
  max_prompts_for_generation: 50
  generation_batch_size: 3
  reward_coeff: 0.1
  # FedBiscuit RL on HH-RLHF 30:70 split
  rlhf_use_variational_selection: False
  rlhf_use_variational_generation: False
  rlhf_selector_checkpoint: "/hdd/hdd3/kjb/checkpoints/final_hhrl_choice_qwen2_fedbiscuit_3070_t20100.ckpt"
  adapter:
    use: True
    count: 3
    args: [ { 'adapter_package': 'peft', 'adapter_method': 'lora', 'r': 8, 'lora_alpha': 16, 'lora_dropout': 0.05 } ]
expname: hrl_fedbiscuit_3070_qwen_t21100
trainer:
  type: llmdporewardtrainer
dataloader:
  batch_size: 1
  num_workers: 0
  pin_memory: True
train:
  local_update_steps: 30
  batch_or_epoch: batch
  optimizer:
    type: AdamW
    betas: (0.9, 0.95)
    lr: 0.00001
  is_enable_half: True
eval:
  freq: 10
  use_gpt_api_for_winrate: true
  use_baseline_model_for_winrate: true
  metrics: ['loss', 'acc', 'helpfulness_winrate', 'harmlessness_winrate']
  best_res_update_round_wise_key: test_loss
  count_flops: False
wandb:
  use: True
  name_user: ''
  name_project: 'fvpl-rl'
  online_track: True
  client_train_info: False
