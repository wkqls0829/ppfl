use_gpu: True
device: 5
early_stop:
  patience: 0
federate:
  mode: standalone
  client_num: 10
  total_round_num: 70
  save_to: "/hdd/hdd3/kjb/checkpoints/hhrl_rlhf_qwen2_comparison_fedvpl_t11201.ckpt"
  save_freq: 10
  share_local_model: True
  online_aggr: False
data:
  root: /hdd/hdd3/kjb/
  type: 'hh-rlhf@llm'
  splits: [0.9,0.09,0.01]
  splitter: 'iid'
model:
  type: 'Qwen/Qwen2-0.5B@huggingface_llm'
llm:
  use: True
  rlhf: True
  tok_len: 1024
  max_new_token: 512
  num_completions: 2
  best_res_update: False
  grad_accum_step: 32
  max_prompts_for_generation: 50
  generation_batch_size: 3
  reward_coeff: 0.1
  # FedVPL RL: variational selection with fixed N(0,I) prior
  rlhf_use_variational_selection: True
  rlhf_use_variational_generation: True
  rlhf_selector_checkpoint: "/hdd/hdd3/kjb/checkpoints/final_hhrl_choice_qwen2_comparison_fedvpl_t10201.ckpt"
  # z-conditioning: inject z into policy input embeddings during DPO.
  # Without these the policy gets no per-client signal and collapses.
  vpl_use_z_embedding: True
  vpl_z_source: 'hidden_state'
  vpl_z_conditioning_mode: 'add'
  vpl_adapter_dropout: 0.5
  vpl_latent_dim: 32
  vpl_feature_method: 'choice_logits'
  vpl_use_feature_difference: True
  vpl_use_difference_only: True
  vpl_use_gp_prior: False
  vpl_kl_weight: 0.1
  vpl_max_logvar: -4.0
  vpl_deep_projection: True
  vpl_logit_dropout: 0.0
  vpl_use_z_embedding: True
  vpl_z_source: 'hidden_state'
  vpl_z_conditioning_mode: 'add'
  vpl_adapter_dropout: 0.5
  adapter:
    use: True
    count: 3
    args: [ { 'adapter_package': 'peft', 'adapter_method': 'lora', 'r': 8, 'lora_alpha': 16, 'lora_dropout': 0.05 } ]
expname: hrl_comparison_fedvpl_qwen_t11201
trainer:
  type: llmdporewardtrainer
dataloader:
  batch_size: 1
  num_workers: 0
  pin_memory: True
train:
  local_update_steps: 30
  batch_or_epoch: batch
  optimizer:
    type: AdamW
    betas: (0.9, 0.95)
    lr: 0.00001
  is_enable_half: True
eval:
  freq: 10
  max_samples_for_reward: 100
  max_iterations_for_winrate: 6000
  use_gpt_api_for_winrate: true
  use_baseline_model_for_winrate: true
  metrics: ['loss', 'acc', 'helpfulness_winrate', 'harmlessness_winrate']
  best_res_update_round_wise_key: test_loss
  count_flops: False
wandb:
  use: True
  name_user: ''
  name_project: 'fvpl-rl'
  online_track: True
  client_train_info: False
