use_gpu: True
device: 3
early_stop:
  patience: 0
federate:
  mode: standalone
  client_num: 1
  total_round_num: 30  # Increased to compensate for reduced local_update_steps (10*60=600 batches, same total training)
  save_to: "/hdd/hdd3/kjb/checkpoints/hhrl_rlhf_gemma_choice_vpl.ckpt"
  save_freq: 50
  share_local_model: True
  online_aggr: False
data:
  root: /hdd/hdd3/kjb/
  type: 'hh-rlhf@llm'
  splits: [0.9,0.09,0.01]
  splitter: 'iid'
model:
  type: 'google/gemma-2b@huggingface_llm'
llm:
  use: True
  rlhf: True
  tok_len: 1024
  max_new_token: 512
  num_completions: 2
  metrics: ['loss', 'acc']
  best_res_update: False
  grad_accum_step: 32  # Increased gradient accumulation to compensate for reduced batch_size (effective batch size = batch_size * grad_accum_step = 1 * 32 = 32, same as before)
  max_prompts_for_generation: 50  # Randomly sample 50 prompts per round instead of using all 1000 (reduces generation time from ~30min to ~1.5min)
  generation_batch_size: 3  # Batch size for text generation (reduced from 5 to save memory). Lower = less memory but slower generation
  # VPL-specific parameters for conditional generation
  vpl_latent_dim: 32  # Should match selector's vpl_latent_dim
  vpl_feature_method: 'choice_logits'  # Should match selector's vpl_feature_method
  # Note: regenerate_data_freq is handled in code with default value of 1
  # It's not in config to avoid KeyError (code uses getattr with default)
expname: hhrl/rlhf_gemma/hhrl_choice_gemma_fedbiscuit_u3_vpl
trainer:
  type: llmdporewardtrainer  # DPO trainer (not VPL trainer, as this is for policy learning)
dataloader:
  batch_size: 1  # Reduced from 2 to 1 to prevent OOM (effective batch size maintained via grad_accum_step=32)
train:
  local_update_steps: 10  # 10 batches per round (10 samples with batch_size=1, but effective batch size = 1 * 32 = 32 via grad_accum_step)
  batch_or_epoch: batch
  optimizer:
    type: AdamW
    betas: (0.9, 0.95)
    lr: 0.0001
  is_enable_half: True
eval:
  freq: 1  # Evaluate every round
  metrics: ['loss', 'acc', 'avg_harmlessness', 'avg_helpfulness']
  count_flops: False
  # Limit the number of samples for reward model evaluation to speed up
  # Set to -1 to evaluate on all samples (slower but more accurate)
  # Reduced from 100 to 20 to speed up evaluation (24 iterations -> ~5 iterations)
  max_samples_for_reward: 20
# Note: enable_personalized_test is handled in code with default value of False
# It's not in config to avoid KeyError (code uses getattr with default)
wandb:
  use: True  # Enable wandb tracking
  name_user: ''  # Your wandb username (leave empty for default)
  name_project: 'fvpl-rl'  # Project name in wandb (RL training, separate from binary selector) in wandb (same as fedbiscuit/hrl, separate from binary selector training)
  online_track: True  # Track results online (real-time)
  client_train_info: True  # Track client training information
