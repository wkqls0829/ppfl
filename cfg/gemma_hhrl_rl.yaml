use_gpu: True
device: 2
early_stop:
  patience: 0
federate:
  mode: standalone
  client_num: 1
  total_round_num: 20
  save_to: "checkpoints/tldr_rlhf_gemma_choice.ckpt"
  save_freq: 50
  share_local_model: True
  online_aggr: False
data:
  root: /hdd/hdd3/kjb/
  type: 'hh-rlhf@llm'
  splits: [0.9,0.09,0.01]
  splitter: 'iid'
llm:
  rlhf: True
  metrics: ['loss', 'acc']
  best_res_update: False
expname: hhrl/rlhf_gemma/<choice_ckpt>
expname: hhrl/rlhf_gemma/choice_run
trainer:
  type: llmrewardchoicetrainer
  choices: ['A', 'B']
