use_gpu: True
device: 0  # Will be remapped by CUDA_VISIBLE_DEVICES
early_stop:
  patience: 0
federate:
  mode: standalone
  client_num: 10
  sample_client_num: 5
  total_round_num: 150
  save_to: "checkpoints/final_hhrl_choice_gemma_fedbiscuit_u3_parallel.ckpt"  # Different from hhst.sh to avoid collision
  ignore_weight: True
  save_freq: 50
  share_local_model: False  # Must be False for process_num to work
  online_aggr: False
  # Multi-GPU parallelization: will be set via command line argument
  # This uses StandaloneMultiGPURunner to parallelize clients across GPUs
  process_num: 2  # Default, can be overridden via command line

data:
  root: /hdd/hdd3/kjb/
  type: 'hh-rlhf@llm'
  splits: [0.9,0.09,0.01]
  splitter: 'meta'

llm:
  use: True
  tok_len: 1024
  max_new_token: 512
  accelerator:
    use: False
  chat:
    max_len: 512
  adapter:
    use: True
    count: 3
    warmup:
      use: True
      round: 50
    grouping:
      use: True
      round: 50
    args: [ { 'adapter_package': 'peft', 'adapter_method': 'lora', 'r': 8, 'lora_alpha': 16, 'lora_dropout': 0.05 } ]
  grad_accum_step: 2

dataloader:
  batch_size: 4

model:
  type: 'google/gemma-2b@huggingface_llm'

train:
  local_update_steps: 30
  batch_or_epoch: batch
  optimizer:
    type: AdamW
    betas: (0.9, 0.95)
    lr: 0.00001
  is_enable_half: True
  # DataParallel alternative (if you prefer model-level parallelization)
  # Uncomment and set GPU IDs if you want to use DataParallel instead of process_num
  # Note: process_num is generally more efficient for federated learning
  # data_para_dids: []  # Example: [0, 1] for 2 GPUs

criterion:
  type: CrossEntropyLoss

trainer:
  type: llmrewardchoicetrainer
  choices: ['A', 'B']

eval:
  freq: 50
  metrics: ['loss', 'acc', 'avg_harmlessness', 'avg_helpfulness']
  best_res_update_round_wise_key: test_loss
  count_flops: False
  # Limit the number of samples for reward model evaluation to speed up
  max_samples_for_reward: 100

expname: hhrl/choice_gemma/fedbiscuit_u3_parallel  # Different from hhst.sh to avoid collision
