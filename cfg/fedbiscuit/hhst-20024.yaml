use_gpu: True
device: 4  # GPU 4 for FedBiscuit baseline experiment (tid: 20024) - same hyperparameters as 50024 but using FedBiscuit algorithm
early_stop:
  patience: 0
federate:
  mode: standalone
  client_num: 10
  sample_client_num: 5
  total_round_num: 50
  save_to: "/hdd/hdd3/kjb/checkpoints/hhrl_choice_gemma_fedbiscuit_u3_20024.ckpt"
  ignore_weight: True
  save_freq: 20  # Checkpoint 저장 빈도 줄여서 I/O 시간 감소
  share_local_model: True  # Single GPU mode
  online_aggr: False
data:
  root: /hdd/hdd3/kjb/
  type: 'hh-rlhf@llm'  # Using hh-rlhf dataset but without reward model evaluation
  splits: [0.9,0.09,0.01]
  splitter: 'meta'
llm:
  use: True
  tok_len: 1024
  max_new_token: 512
  accelerator:
    use: False
  chat:
    max_len: 512
  adapter:
    use: True
    count: 3
    warmup:
      use: True
      round: 2
    grouping:
      use: False
      round: 2
    args: [ { 'adapter_package': 'peft', 'adapter_method': 'lora', 'r': 8, 'lora_alpha': 16, 'lora_dropout': 0.05 } ]
  freeze_base_model: True  # Freeze base model for adapter-only training
  grad_accum_step: 2  # Same as 50024
dataloader:
  batch_size: 16  # Same as 50024
  num_workers: 4  # DataLoader 병렬화로 데이터 로딩 속도 향상
  pin_memory: True  # GPU 전송 속도 향상
model:
  type: 'google/gemma-2b@huggingface_llm'
train:
  local_update_steps: 30  # Same as 50024
  batch_or_epoch: batch
  optimizer:
    type: AdamW
    betas: (0.9, 0.95)  # Same as 50024
    lr: 0.0001  # Same as 50024
  is_enable_half: True
criterion:
  type: CrossEntropyLoss
trainer:
  type: llmrewardchoicetrainer  # FedBiscuit baseline trainer (no VPL)
  choices: ['A', 'B']
eval:
  freq: 5  # Evaluation 빈도 줄여서 전체 트레이닝 시간 단축
  metrics: ['loss', 'acc']  # Baseline metrics (no VPL metrics)
  best_res_update_round_wise_key: train_avg_loss  # Use train_avg_loss instead of val_avg_loss
  count_flops: False
  max_samples_for_reward: 100
expname: fedbiscuit_hhst_t20024
wandb:
  use: True
  name_user: ''
  name_project: 'fvpl-selector'  # Same project as 50024 for comparison
  online_track: True
  client_train_info: True
