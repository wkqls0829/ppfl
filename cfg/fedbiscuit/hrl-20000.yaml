use_gpu: True
device: 1  # GPU 1 for FedBiscuit HRL experiment (tid: 20000)
early_stop:
  patience: 0
federate:
  mode: standalone
  client_num: 1
  total_round_num: 30
  save_to: "/hdd/hdd3/kjb/checkpoints/hhrl_rlhf_gemma_choice_fedbiscuit_20000.ckpt"
  save_freq: 50
  share_local_model: True
  online_aggr: False
data:
  root: /hdd/hdd3/kjb/
  type: 'hh-rlhf@llm'
  splits: [0.9,0.09,0.01]
  splitter: 'iid'
model:
  type: 'google/gemma-2b@huggingface_llm'
llm:
  use: True
  rlhf: True
  tok_len: 1024
  max_new_token: 512
  num_completions: 2
  metrics: ['loss', 'acc']
  best_res_update: False
  grad_accum_step: 32
  max_prompts_for_generation: 50
  generation_batch_size: 3
  reward_coeff: 0.1
expname: hhrl/rlhf_gemma/hhrl_choice_gemma_fedbiscuit_u3_20000
trainer:
  type: llmdporewardtrainer
dataloader:
  batch_size: 1
train:
  local_update_steps: 10
  batch_or_epoch: batch
  optimizer:
    type: AdamW
    betas: (0.9, 0.95)
    lr: 0.0001
  is_enable_half: True
eval:
  freq: 1
  metrics: ['loss', 'acc', 'avg_harmlessness', 'avg_helpfulness']
  count_flops: False
  max_samples_for_reward: 20
wandb:
  use: True
  name_user: ''
  name_project: 'fvpl-rl'  # Same project as recent RL experiments
  online_track: True
  client_train_info: True
