use_gpu: True
device: 0  # Change this for your GPU
early_stop:
  patience: 0
federate:
  mode: standalone
  client_num: 1  # RL training uses single client (standalone RLHF)
  total_round_num: 50
  save_to: "/hdd/hdd3/kjb/checkpoints/hhrl_choice_gemma_fedbiscuit_u3_vplgp_ortho_60000.ckpt"  # Override in script
  ignore_weight: True
  save_freq: 20
  share_local_model: True  # Single GPU mode
  online_aggr: False
data:
  root: /hdd/hdd3/kjb/
  type: 'hh-rlhf@llm'
  splits: [0.9,0.09,0.01]
  splitter: 'iid'  # RL training uses iid splitter
llm:
  use: True
  rlhf: True  # Enable RLHF training (DPO)
  tok_len: 1024
  max_new_token: 512
  num_completions: 2
  accelerator:
    use: False
  chat:
    max_len: 512
  adapter:
    use: True
    count: 3
    warmup:
      use: True
      round: 2
    grouping:
      use: False
      round: 2
    args: [ { 'adapter_package': 'peft', 'adapter_method': 'lora', 'r': 8, 'lora_alpha': 16, 'lora_dropout': 0.05 } ]
  # VPL parameters for z-dependent generation (loaded from selector checkpoint)
  vpl_latent_dim: 32
  vpl_feature_method: 'choice_logits'
  vpl_use_feature_difference: True
  vpl_gp_temperature: 1.0
  # RLHF with z-dependent generation
  rlhf_use_variational_generation: True
  rlhf_use_variational_selection: True
  rlhf_selector_checkpoint: "/hdd/hdd3/kjb/checkpoints/hhrl_choice_gemma_fedbiscuit_u3_vplgp_ortho_50022.ckpt"  # Override with selector_cfg_file
  reward_coeff: 0.1
  grad_accum_step: 4
  max_prompts_for_generation: 50
  generation_batch_size: 3
dataloader:
  batch_size: 1  # Small batch size for RL training
  num_workers: 4
  pin_memory: True
model:
  type: 'google/gemma-2b@huggingface_llm'
train:
  local_update_steps: 30
  batch_or_epoch: batch
  optimizer:
    type: AdamW
    betas: (0.9, 0.95)
    lr: 0.0001
  is_enable_half: True
criterion:
  type: CrossEntropyLoss
trainer:
  type: llmdporewardtrainer
eval:
  freq: 5
  metrics: ['loss', 'acc']  # Reward model evaluation disabled
  best_res_update_round_wise_key: train_avg_loss
  count_flops: False
  # openai_api_key: set via environment variable OPENAI_API_KEY
expname: vplgp_hrl_ortho_t60000  # Override in script
wandb:
  use: True
  name_user: ''
  name_project: 'fvpl-rl'
  online_track: True
  client_train_info: True
