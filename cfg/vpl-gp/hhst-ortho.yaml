use_gpu: True
device: 0  # Base device, will be overridden by process_num
backend: 'torch'
early_stop:
  patience: 0
federate:
  mode: standalone
  client_num: 10
  sample_client_num: 5
  total_round_num: 50
  save_to: "/hdd/hdd3/kjb/checkpoints/hhrl_choice_gemma_fedbiscuit_u3_vplgp_ortho_60000.ckpt"
  ignore_weight: True
  save_freq: 10
  share_local_model: False  # Required for multi-GPU parallel training
  online_aggr: False
  process_num: 8  # Number of GPUs to use (1 server + 7 clients). Adjust based on available GPUs
data:
  root: /hdd/hdd3/kjb/
  type: 'hh-rlhf@llm'
  splits: [0.9,0.09,0.01]
  splitter: 'meta'
llm:
  use: True
  tok_len: 1024
  max_new_token: 512
  accelerator:
    use: False
  chat:
    max_len: 512
  adapter:
    use: True
    count: 3
    warmup:
      use: True
      round: 2
    grouping:
      use: False
      round: 2
    args: [ { 'adapter_package': 'peft', 'adapter_method': 'lora', 'r': 8, 'lora_alpha': 16, 'lora_dropout': 0.05 } ]
  # Variational Preference Learning with Gumbel-Softmax Prior (VPL-GP) parameters
  vpl_use_gp_prior: True
  vpl_latent_dim: 32
  vpl_kl_weight: 0.1
  vpl_gp_temperature: 1.0
  vpl_feature_method: 'choice_logits'
  vpl_use_feature_difference: True
  # Orthogonal loss parameters (ENABLED for this experiment)
  vpl_orthogonal_weight: 10.0  # Pull loss weight (CLOP paper)
  vpl_orthogonal_orthonorm_weight: 0.1  # Orthonormal constraint weight
  vpl_use_manual_orthogonal_labels: True  # Use server-computed orthogonal labels
  grad_accum_step: 2
dataloader:
  batch_size: 4
model:
  type: 'google/gemma-2b@huggingface_llm'
train:
  local_update_steps: 30
  batch_or_epoch: batch
  optimizer:
    type: AdamW
    betas: (0.9, 0.95)
    lr: 0.00001
  is_enable_half: True
criterion:
  type: CrossEntropyLoss
trainer:
  type: vplgprewardchoicetrainer  # Use VPL-GP trainer
  choices: ['A', 'B']
eval:
  freq: 2
  metrics: ['loss', 'acc', 'avg_harmlessness', 'avg_helpfulness', 'vpl_kl_loss', 'vpl_reconstruction_loss']
  best_res_update_round_wise_key: val_avg_loss
  count_flops: False
  max_samples_for_reward: 100
expname: vplgp_hhst_ortho_t60000
wandb:
  use: True
  name_user: ''
  name_project: 'fvpl-selector'
  online_track: True
  client_train_info: True
