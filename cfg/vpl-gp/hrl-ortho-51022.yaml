use_gpu: True
device: 1  # GPU 1 for HRL experiment (tid: 51022) - based on 50022 with reward model evaluation
early_stop:
  patience: 0
federate:
  mode: standalone
  client_num: 1  # RL training uses single client (standalone RLHF)
  total_round_num: 30  # RL training rounds
  save_to: "/hdd/hdd3/kjb/checkpoints/hhrl_choice_gemma_fedbiscuit_u3_vplgp_ortho_51022.ckpt"
  ignore_weight: True
  save_freq: 20  # Checkpoint 저장 빈도 줄여서 I/O 시간 감소
  share_local_model: True  # Single GPU mode
  online_aggr: False
data:
  root: /hdd/hdd3/kjb/
  type: 'hh-rlhf@llm'  # Using hh-rlhf dataset for RL training
  splits: [0.9,0.09,0.01]
  splitter: 'iid'  # RL training uses iid splitter
llm:
  use: True
  rlhf: True  # Enable RLHF training (DPO)
  tok_len: 1024
  max_new_token: 512
  num_completions: 2  # Number of completions to generate per prompt
  accelerator:
    use: False
  chat:
    max_len: 512
  adapter:
    use: True
    count: 3
    warmup:
      use: True
      round: 2
    grouping:
      use: False
      round: 2
    args: [ { 'adapter_package': 'peft', 'adapter_method': 'lora', 'r': 8, 'lora_alpha': 16, 'lora_dropout': 0.05 } ]
  # VPL parameters for z-dependent generation (loaded from selector checkpoint)
  vpl_latent_dim: 32  # Should match selector's vpl_latent_dim
  vpl_feature_method: 'choice_logits'  # Should match selector's vpl_feature_method
  vpl_use_feature_difference: True  # Should match selector
  vpl_gp_temperature: 1.0  # Should match selector's vpl_gp_temperature
  # RLHF with z-dependent generation
  rlhf_use_variational_generation: True  # Use z-dependent generation for RL training
  rlhf_use_variational_selection: True  # Use variational selection for preference data generation
  rlhf_selector_checkpoint: "/hdd/hdd3/kjb/checkpoints/hhrl_choice_gemma_fedbiscuit_u3_vplgp_ortho_50022.ckpt"  # Selector checkpoint path for loading VPL components (will be overridden by selector_cfg_file)
  reward_coeff: 0.1  # DPO beta coefficient
  grad_accum_step: 4  # Gradient accumulation steps
  max_prompts_for_generation: 50  # Number of prompts to generate per round
  generation_batch_size: 3  # Batch size for text generation
dataloader:
  batch_size: 1  # Small batch size for RL training (effective batch size = batch_size * grad_accum_step = 1 * 4 = 4)
  num_workers: 4  # DataLoader 병렬화로 데이터 로딩 속도 향상
  pin_memory: True  # GPU 전송 속도 향상
model:
  type: 'google/gemma-2b@huggingface_llm'
train:
  local_update_steps: 10  # RL training steps per round
  batch_or_epoch: batch
  optimizer:
    type: AdamW
    betas: (0.9, 0.95)
    lr: 0.0001  # Increased 10x from 0.00001 to compensate for frozen base model
  is_enable_half: True
criterion:
  type: CrossEntropyLoss
trainer:
  type: llmdporewardtrainer  # DPO trainer for RL training (not binary selector)
eval:
  freq: 5  # Evaluation 빈도
  metrics: ['loss', 'acc', 'avg_helpfulness', 'avg_harmlessness',
            'helpfulness_winrate', 'harmlessness_winrate', 'avg_winlose_rate']  # RL: drop VPL losses, add avg win/lose
  best_res_update_round_wise_key: train_avg_loss  # Use train_avg_loss instead of val_avg_loss
  count_flops: False
  max_samples_for_reward: 100
expname: vplgp_hrl_ortho_t51022
wandb:
  use: True
  name_user: ''
  name_project: 'fvpl-rl'  # New WandB project for RL experiments
  online_track: True
  client_train_info: True
