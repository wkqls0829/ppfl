use_gpu: True
device: 4  # GPU 4 for ultrafeedback test (tid: 50000)
early_stop:
  patience: 0
federate:
  mode: standalone
  client_num: 20  # UltraFeedback equal distribution: 5, 5, 5, 5 per dimension
  sample_client_num: 5  # Only 5 clients participate per round (sequential training → one on GPU at a time)
  total_round_num: 5  # Test run: 5 rounds only
  save_to: "/hdd/hdd3/kjb/checkpoints/ultrafeedback_choice_gemma_fedbiscuit_u3_vplgp_ortho_50000.ckpt"
  ignore_weight: True
  save_freq: 5  # Save every round for test
  share_local_model: True  # Single GPU mode
  online_aggr: False
data:
  root: /hdd/hdd3/kjb/
  type: 'ultrafeedback@llm'  # UltraFeedback dataset
  ultrafeedback_threshold: 3.0  # Threshold for conflicting pairs
  splits: [0.9,0.09,0.01]
  splitter: 'meta'
  max_train_samples: 1000  # Limit to 1000 samples for fast testing
  max_test_samples: 200  # Limit to 200 samples for fast testing
llm:
  use: True
  tok_len: 1024
  max_new_token: 512
  accelerator:
    use: False
  chat:
    max_len: 512
  adapter:
    use: True
    count: 3
    warmup:
      use: True
      round: 2
    grouping:
      use: False
      round: 2
    args: [ { 'adapter_package': 'peft', 'adapter_method': 'lora', 'r': 8, 'lora_alpha': 16, 'lora_dropout': 0.05 } ]
  # Variational Preference Learning with Gumbel-Softmax Prior (VPL-GP) parameters
  vpl_use_gp_prior: True
  vpl_latent_dim: 32
  vpl_kl_weight: 0.05
  vpl_gp_temperature: 5.0
  vpl_feature_method: 'choice_logits'
  vpl_use_feature_difference: True
  vpl_use_difference_only: True  # Use only difference embedding
  vpl_max_logvar: -3.0  # Tighter variance cap (sigma <= 0.223)
  # Orthogonal loss parameters (ENABLED)
  vpl_orthogonal_weight: 1.0
  vpl_orthogonal_orthonorm_weight: 0.1
  vpl_use_manual_orthogonal_labels: True  # Use manual labeling based on preference dimensions
  vpl_num_prototypes: 4  # Number of orthogonal prototypes (4 dimensions for UltraFeedback)
  vpl_prototype_scale: 2.0  # From hyperparameter search (UltraFeedback: num_prototypes 4 kept)
  vpl_tsne_visualize_freq: 5  # Generate t-SNE visualization every 5 rounds (for test)
  grad_accum_step: 4
dataloader:
  batch_size: 8
  num_workers: 2  # Reduced to save memory
  pin_memory: False  # Disabled to save memory
model:
  type: 'google/gemma-2b@huggingface_llm'  # gemma-2b model
train:
  local_update_steps: 20  # Reduced to save memory for test run
  batch_or_epoch: batch
  optimizer:
    type: AdamW
    betas: (0.9, 0.95)
    lr: 0.0001
  is_enable_half: True
criterion:
  type: CrossEntropyLoss
trainer:
  type: vplgprewardchoicetrainer  # Use VPL-GP trainer
  choices: ['A', 'B']
eval:
  freq: 5  # Evaluate every round for test
  metrics: ['loss', 'acc', 'vpl_kl_loss', 'vpl_reconstruction_loss', 'vpl_orthogonal_loss']  # Winrate metrics disabled for test (too slow)
  best_res_update_round_wise_key: train_avg_loss
  count_flops: False
  max_samples_for_reward: 30  # Reduced for faster evaluation
expname: vplgp_hhst_ultrafeedback_t50000_test
wandb:
  use: True
  name_user: ''
  name_project: 'fvpl-selector'
  online_track: True
  client_train_info: True
