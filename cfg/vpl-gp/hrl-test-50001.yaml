use_gpu: True
device: 0  # GPU 0 for test run (tid: 50001 RL test)
early_stop:
  patience: 0
federate:
  mode: standalone
  client_num: 1
  total_round_num: 5  # Test run: 5 rounds only
  save_to: /hdd/hdd3/kjb/checkpoints/hhrl_rlhf_gemma_choice_vplgp_ortho_50001_test.ckpt
  ignore_weight: true
  save_freq: 5  # Save every round for test
  share_local_model: true
  online_aggr: false
data:
  root: /hdd/hdd3/kjb/
  type: hh-rlhf@llm
  splits:
  - 0.9
  - 0.09
  - 0.01
  splitter: iid
  max_train_samples: 100  # Limit for fast testing
  max_test_samples: 50  # Limit for fast testing
llm:
  use: true
  rlhf: true
  tok_len: 1024
  max_new_token: 512
  num_completions: 2
  accelerator:
    use: false
  chat:
    max_len: 512
  adapter:
    use: true
    count: 3
    warmup:
      use: true
      round: 2
    grouping:
      use: false
      round: 2
    args:
    - adapter_package: peft
      adapter_method: lora
      r: 8
      lora_alpha: 16
      lora_dropout: 0.05
  vpl_latent_dim: 32  # Match selector's vpl_latent_dim
  vpl_feature_method: choice_logits  # Match selector's vpl_feature_method
  vpl_use_feature_difference: true
  vpl_use_difference_only: true
  vpl_gp_temperature: 1.0  # Match selector's vpl_gp_temperature
  rlhf_use_variational_selection: true  # Use z from selector for conditional selection
  rlhf_use_variational_generation: false  # Generation without z (for test)
  rlhf_selector_checkpoint: /hdd/hdd3/kjb/checkpoints/final_hhrl_choice_gemma_fedbiscuit_u3_vplgp_ortho_50001.ckpt
  reward_coeff: 0.1
  grad_accum_step: 4  # Reduced for test (baseline uses 32)
  max_prompts_for_generation: 20  # Reduced for fast testing (baseline uses 50)
  generation_batch_size: 2  # Reduced for test (baseline uses 3)
  max_samples_for_reward: 30  # Reduced for fast testing
  use_gpt_api_for_winrate: true  # Use GPT API for winrate evaluation (faster)
  use_baseline_model_for_winrate: true  # Compare with baseline model
  openai_model: gpt-4o-mini  # Use cheaper model for test
dataloader:
  batch_size: 1
  num_workers: 2  # Reduced for test
  pin_memory: false  # Disabled to save memory
model:
  type: google/gemma-2b@huggingface_llm  # gemma-2b model
train:
  local_update_steps: 10  # Reduced for test (baseline uses 30)
  batch_or_epoch: batch
  optimizer:
    type: AdamW
    betas: (0.9, 0.95)
    lr: 0.0001  # Adjusted for gemma-2b
  is_enable_half: true
criterion:
  type: CrossEntropyLoss
trainer:
  type: llmdporewardtrainer  # DPO trainer for RLHF
eval:
  freq: 1  # Evaluate every round for test
  metrics:
  - loss
  - acc
  # Reward model evaluation disabled
  best_res_update_round_wise_key: test_loss
  count_flops: false
expname: vplgp_hrl_ortho_t50001_test
wandb:
  use: true
  name_user: ''
  name_project: fvpl-rl
  online_track: true
  client_train_info: false
