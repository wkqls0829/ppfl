# VPL-GP RL (RLHF) - UltraFeedback, selector from 50010 (full 50-round training)
# TID 50011, GPU 3. Selector: hhst-ultrafeedback-50010.
use_gpu: True
device: 3
early_stop:
  patience: 0
federate:
  mode: standalone
  client_num: 1
  total_round_num: 50
  save_to: "/hdd/hdd3/kjb/checkpoints/hhrl_rlhf_gemma_choice_vplgp_ortho_uf_50011.ckpt"
  ignore_weight: True
  save_freq: 20
  share_local_model: True
  online_aggr: False
data:
  root: /hdd/hdd3/kjb/
  type: 'ultrafeedback@llm'
  ultrafeedback_threshold: 3.0
  splits: [0.9, 0.09, 0.01]
  splitter: 'iid'
llm:
  use: True
  rlhf: True
  tok_len: 1024
  max_new_token: 512
  num_completions: 2
  accelerator:
    use: False
  chat:
    max_len: 512
  adapter:
    use: True
    count: 3
    warmup:
      use: True
      round: 2
    grouping:
      use: False
      round: 2
    args: [ { 'adapter_package': 'peft', 'adapter_method': 'lora', 'r': 8, 'lora_alpha': 16, 'lora_dropout': 0.05 } ]
  vpl_latent_dim: 32
  vpl_feature_method: 'choice_logits'
  vpl_use_feature_difference: True
  vpl_use_difference_only: True
  vpl_kl_weight: 0.05
  vpl_gp_temperature: 5.0  # Match selector (Gemma Phase 5)
  vpl_num_prototypes: 4
  rlhf_use_variational_generation: True
  rlhf_use_variational_selection: True
  rlhf_selector_checkpoint: "/hdd/hdd3/kjb/checkpoints/final_ultrafeedback_choice_gemma_fedbiscuit_u3_vplgp_ortho_50010.ckpt"
  reward_coeff: 0.1
  grad_accum_step: 4
  max_prompts_for_generation: 50
  generation_batch_size: 3
dataloader:
  batch_size: 1
  num_workers: 4
  pin_memory: True
model:
  type: 'google/gemma-2b@huggingface_llm'
train:
  local_update_steps: 30
  batch_or_epoch: batch
  optimizer:
    type: AdamW
    betas: (0.9, 0.95)
    lr: 0.0001
  is_enable_half: True
criterion:
  type: CrossEntropyLoss
trainer:
  type: llmdporewardtrainer
eval:
  freq: 10
  use_gpt_api_for_winrate: true
  use_baseline_model_for_winrate: true
  metrics: ['loss', 'acc', 'helpfulness_winrate', 'harmlessness_winrate', 'instruction_following_winrate', 'truthfulness_winrate']
  best_res_update_round_wise_key: train_avg_loss
  count_flops: False
expname: vplgp_hrl_ultrafeedback_t50011
wandb:
  use: True
  name_user: ''
  name_project: 'fvpl-rl'
  online_track: True
  client_train_info: True
