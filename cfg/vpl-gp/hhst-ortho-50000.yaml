use_gpu: True
device: 3  # GPU 3 for test run (tid: 50000) - z 저장 기능 테스트
early_stop:
  patience: 0
federate:
  mode: standalone
  client_num: 10
  sample_client_num: 5
  total_round_num: 5  # Test run: 5 rounds only
  save_to: "/hdd/hdd3/kjb/checkpoints/hhrl_choice_gemma_fedbiscuit_u3_vplgp_ortho_50000.ckpt"
  ignore_weight: True
  save_freq: 5  # Save every round for test
  share_local_model: True  # Single GPU mode
  online_aggr: False
data:
  root: /hdd/hdd3/kjb/
  type: 'hh-rlhf@llm'  # Using hh-rlhf dataset but without reward model evaluation
  splits: [0.9,0.09,0.01]
  splitter: 'meta'
  max_train_samples: 1000  # Limit to 1000 samples for fast testing (default: -1 = no limit)
  max_test_samples: 200  # Limit to 200 samples for fast testing (default: -1 = no limit)
llm:
  use: True
  tok_len: 1024
  max_new_token: 512
  accelerator:
    use: False
  chat:
    max_len: 512
  adapter:
    use: True
    count: 3
    warmup:
      use: True
      round: 2
    grouping:
      use: False
      round: 2
    args: [ { 'adapter_package': 'peft', 'adapter_method': 'lora', 'r': 8, 'lora_alpha': 16, 'lora_dropout': 0.05 } ]
  # Variational Preference Learning with Gumbel-Softmax Prior (VPL-GP) parameters
  vpl_use_gp_prior: True
  vpl_latent_dim: 32
  vpl_kl_weight: 0.1  # Lower KL to let mu move away from origin
  vpl_gp_temperature: 1.0
  vpl_feature_method: 'choice_logits'
  vpl_use_feature_difference: True
  vpl_max_logvar: -3.0  # Tighter variance cap (sigma <= 0.223)
  # Orthogonal loss parameters (ENABLED, reduced for better minimization)
  vpl_orthogonal_weight: 1.0  # Pull loss weight (reduced from 10.0)
  vpl_orthogonal_orthonorm_weight: 0.1  # Orthonormal constraint weight (reduced from 1.0)
  vpl_use_manual_orthogonal_labels: True  # Use manual labeling: harmlessness (0) and helpfulness (1) based on train data
  vpl_num_prototypes: 2  # Number of orthogonal prototypes (k for k-means). For hh-rlhf, this is fixed to 2
  vpl_prototype_scale: 5.0  # Distance of prototypes from origin (default: 5.0, larger = further from origin)
  vpl_tsne_visualize_freq: 5  # Generate t-SNE visualization every 5 rounds (for test)
  grad_accum_step: 4  # Increased to compensate for reduced batch_size
dataloader:
  batch_size: 8  # Reduced from 16 to save memory (effective batch size = 8 * 4 = 32)
  num_workers: 2  # Reduced to save memory
  pin_memory: False  # Disabled to save memory
model:
  type: 'google/gemma-2b@huggingface_llm'
train:
  local_update_steps: 20  # Reduced to save memory for test run
  batch_or_epoch: batch
  optimizer:
    type: AdamW
    betas: (0.9, 0.95)
    lr: 0.0001  # Base LR (no multiplier)
  is_enable_half: True
criterion:
  type: CrossEntropyLoss
trainer:
  type: vplgprewardchoicetrainer  # Use VPL-GP trainer
  choices: ['A', 'B']
eval:
  freq: 5  # Evaluate every round for test
  metrics: ['loss', 'acc', 'vpl_kl_loss', 'vpl_reconstruction_loss', 'vpl_orthogonal_loss']  # Removed reward model metrics for HHST
  best_res_update_round_wise_key: train_avg_loss  # Use train_avg_loss instead of val_avg_loss
  count_flops: False
  max_samples_for_reward: 100
expname: vplgp_hhst_ortho_t50000
wandb:
  use: True
  name_user: ''
  name_project: 'fvpl-selector'
  online_track: True
  client_train_info: True
