use_gpu: True
device: 5  # GPU 5 reserved for VPL-GP algorithm
early_stop:
  patience: 0
federate:
  mode: standalone
  client_num: 1
  total_round_num: 50
  save_to: "/hdd/hdd3/kjb/checkpoints/hhrl_rlhf_gemma_choice_vplgp.ckpt"
  save_freq: 50
  share_local_model: True
  online_aggr: False
data:
  root: /hdd/hdd3/kjb/
  type: 'hh-rlhf@llm'
  splits: [0.9,0.09,0.01]
  splitter: 'iid'
model:
  type: 'google/gemma-2b@huggingface_llm'
llm:
  use: True
  rlhf: True
  tok_len: 1024
  max_new_token: 512
  num_completions: 2
  metrics: ['loss', 'acc']
  best_res_update: False
  grad_accum_step: 32
  max_prompts_for_generation: 50
  generation_batch_size: 3
  # VPL-GP specific parameters for conditional generation
  vpl_latent_dim: 32  # Should match selector's vpl_latent_dim
  vpl_feature_method: 'choice_logits'  # Should match selector's vpl_feature_method
  vpl_gp_temperature: 1.0  # Should match selector's vpl_gp_temperature
expname: hhrl/rlhf_gemma/hhrl_choice_gemma_fedbiscuit_u3_vplgp
trainer:
  type: llmdporewardtrainer  # DPO trainer (not VPL-GP trainer, as this is for policy learning)
dataloader:
  batch_size: 1
train:
  local_update_steps: 30
  batch_or_epoch: batch
  optimizer:
    type: AdamW
    betas: (0.9, 0.95)
    lr: 0.0001
  is_enable_half: True
eval:
  freq: 1
  metrics: ['loss', 'acc']
  best_res_update_round_wise_key: test_loss
  count_flops: False
wandb:
  use: True
  name_user: ''
  name_project: 'fvpl-rl'  # Project name in wandb (RL training)
  online_track: True
  client_train_info: False
