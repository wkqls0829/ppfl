use_gpu: True
device: 0  # SLURM sets CUDA_VISIBLE_DEVICES, so always use device 0
early_stop:
  patience: 0
federate:
  mode: standalone
  client_num: 1
  total_round_num: 50
  save_to: "/hdd/hdd3/kjb/checkpoints/hhrl_rlhf_gemma_choice_vplgp.ckpt"
  save_freq: 50
  share_local_model: True
  online_aggr: False
data:
  root: /hdd/hdd3/kjb/
  type: 'hh-rlhf@llm'
  splits: [0.9,0.09,0.01]
  splitter: 'iid'
model:
  type: 'google/gemma-2b@huggingface_llm'
llm:
  use: True
  rlhf: True
  tok_len: 1024
  max_new_token: 512
  num_completions: 2
  metrics: ['loss', 'acc']
  best_res_update: False
  grad_accum_step: 32
  max_prompts_for_generation: 50
  generation_batch_size: 3
  # VPL-GP specific parameters for conditional generation
  vpl_latent_dim: 32  # Should match selector's vpl_latent_dim
  vpl_feature_method: 'choice_logits'  # Should match selector's vpl_feature_method
  vpl_gp_temperature: 5.0  # Gemma Phase 5 combined best (match selector)
  vpl_kl_weight: 0.05  # From hyperparameter search (match selector)
  vpl_use_gp_prior: True  # GP prior enabled
  vpl_use_feature_difference: True
  vpl_use_difference_only: True
  vpl_max_logvar: -3.0
  # Orthogonal loss parameters (can be overridden by script)
  vpl_orthogonal_weight: 0.0  # Default: disabled (can be set to 1.0 for VPL-GP-Ortho)
  vpl_orthogonal_orthonorm_weight: 0.0  # Default: disabled
  vpl_use_manual_orthogonal_labels: False
  vpl_num_prototypes: 0
  vpl_prototype_scale: 0.0
  adapter:
    use: True
    count: 3
expname: hhrl/rlhf_gemma/hhrl_choice_gemma_fedbiscuit_u3_vplgp
trainer:
  type: llmdporewardtrainer  # DPO trainer (not VPL-GP trainer, as this is for policy learning)
dataloader:
  batch_size: 1
  num_workers: 0  # Set to 0 to avoid "Too many open files" error in cluster environment
train:
  local_update_steps: 30
  batch_or_epoch: batch
  optimizer:
    type: AdamW
    betas: (0.9, 0.95)
    lr: 0.0001
  is_enable_half: True
eval:
  freq: 10
  use_gpt_api_for_winrate: true
  use_baseline_model_for_winrate: true
  metrics: ['loss', 'acc', 'helpfulness_winrate', 'harmlessness_winrate']  # Reward model (avg_*) disabled; GPT-4 winrate kept
  best_res_update_round_wise_key: test_loss
  count_flops: False
wandb:
  use: True
  name_user: ''
  name_project: 'fvpl-rl'  # Project name in wandb (RL training)
  online_track: True
  client_train_info: False
