use_gpu: True
device: 0  # GPU 0 for hpsearch experiment (tid: 52007) - Phase 2: kl_weight=0.02
early_stop:
  patience: 0
federate:
  mode: standalone
  client_num: 10
  sample_client_num: 5
  total_round_num: 50
  save_to: "/hdd/hdd3/kjb/checkpoints/hhrl_choice_gemma_fedbiscuit_u3_vplgp_ortho_52007.ckpt"
  ignore_weight: True
  save_freq: 20
  share_local_model: True
  online_aggr: False
data:
  root: /hdd/hdd3/kjb/
  type: 'hh-rlhf@llm'
  splits: [0.9,0.09,0.01]
  splitter: 'meta'
llm:
  use: True
  tok_len: 1024
  max_new_token: 512
  accelerator:
    use: False
  chat:
    max_len: 512
  adapter:
    use: True
    count: 3
    warmup:
      use: True
      round: 2
    grouping:
      use: False
      round: 2
    args: [ { 'adapter_package': 'peft', 'adapter_method': 'lora', 'r': 8, 'lora_alpha': 16, 'lora_dropout': 0.05 } ]
  # Variational Preference Learning with Gumbel-Softmax Prior (VPL-GP) parameters
  vpl_use_gp_prior: True
  vpl_latent_dim: 32
  vpl_kl_weight: 0.02  # Reduced from baseline 0.1 (5x range)
  vpl_gp_temperature: 1.0
  vpl_feature_method: 'choice_logits'
  vpl_use_feature_difference: True
  vpl_use_difference_only: True
  vpl_max_logvar: -3.0
  # Orthogonal loss parameters (baseline from Phase 1 best)
  vpl_orthogonal_weight: 1.0
  vpl_orthogonal_orthonorm_weight: 0.1
  vpl_use_manual_orthogonal_labels: True
  vpl_num_prototypes: 2
  vpl_prototype_scale: 5.0
  vpl_tsne_visualize_freq: 10
  grad_accum_step: 4
dataloader:
  batch_size: 8
  num_workers: 4
  pin_memory: True
model:
  type: 'google/gemma-2b@huggingface_llm'
train:
  local_update_steps: 30
  batch_or_epoch: batch
  optimizer:
    type: AdamW
    betas: (0.9, 0.95)
    lr: 0.0001
  is_enable_half: True
criterion:
  type: CrossEntropyLoss
trainer:
  type: vplgprewardchoicetrainer
  choices: ['A', 'B']
eval:
  freq: 5
  metrics: ['loss', 'acc', 'vpl_kl_loss', 'vpl_reconstruction_loss', 'vpl_orthogonal_loss']
  best_res_update_round_wise_key: train_avg_loss
  count_flops: False
  max_samples_for_reward: 100
expname: vplgp_hhst_ortho_t52007
wandb:
  use: True
  name_user: ''
  name_project: 'fvpl-selector'
  online_track: True
  client_train_info: True
