use_gpu: true
device: 4
early_stop:
  patience: 0
federate:
  mode: standalone
  client_num: 100
  total_round_num: 50
  save_to: /hdd/hdd3/kjb/checkpoints/hhrl_rlhf_gemma_choice_local_only_t01002.ckpt
  save_freq: 20
  share_local_model: true
  online_aggr: false
  sample_client_num: 10
data:
  root: /hdd/hdd3/kjb
  type: hh-rlhf@llm
  splits:
  - 0.9
  - 0.09
  - 0.01
  splitter: iid
model:
  type: google/gemma-2b@huggingface_llm
llm:
  use: true
  rlhf: true
  tok_len: 1024
  max_new_token: 512
  num_completions: 2
  accelerator:
    use: false
  chat:
    max_len: 512
  adapter:
    use: true
    count: 3
    warmup:
      use: true
      round: 2
    grouping:
      use: false
      round: 2
    args:
    - adapter_package: peft
      adapter_method: lora
      r: 8
      lora_alpha: 16
      lora_dropout: 0.05
  reward_coeff: 0.1
  grad_accum_step: 4
  max_prompts_for_generation: 50
  generation_batch_size: 3
  rlhf_use_variational_selection: false
  rlhf_use_variational_generation: false
expname: rl_local_only_t01002_n100
trainer:
  type: llmdporewardtrainer
dataloader:
  batch_size: 1
  num_workers: 0
  pin_memory: true
train:
  local_update_steps: 30
  batch_or_epoch: batch
  optimizer:
    type: AdamW
    betas: (0.9, 0.95)
    lr: 0.0001
  is_enable_half: true
criterion:
  type: CrossEntropyLoss
eval:
  freq: 10
  use_gpt_api_for_winrate: true
  use_baseline_model_for_winrate: true
  metrics:
  - loss
  - acc
  - helpfulness_winrate
  - harmlessness_winrate
  best_res_update_round_wise_key: train_avg_loss
  count_flops: false
wandb:
  use: true
  name_user: ''
  name_project: fvpl-rl
  online_track: true
  client_train_info: true
