use_gpu: True
device: 0  # Override in script
early_stop:
  patience: 0
federate:
  mode: standalone
  client_num: 20  # All 20 clients participate in evaluation (10 training + 10 unseen)
  total_round_num: 50
  save_to: "/hdd/hdd3/kjb/checkpoints/hhrl_rlhf_gemma_unseen_vplgp.ckpt"  # Override in script
  save_freq: 50
  share_local_model: True
  online_aggr: False
data:
  root: /hdd/hdd3/kjb/
  type: 'hh-rlhf@llm'
  splits: [0.9,0.09,0.01]
  splitter: 'iid'
  # Note: Total 20 clients will be created
  # First 10 clients (5 harmless + 5 helpful) participated in selector training
  # All 20 clients will participate in RL evaluation to test adaptation to unseen clients
model:
  type: 'google/gemma-2b@huggingface_llm'
llm:
  use: True
  rlhf: True
  tok_len: 1024
  max_new_token: 512
  num_completions: 2
  metrics: ['loss', 'acc', 'helpfulness_winrate', 'harmlessness_winrate']
  best_res_update: False
  grad_accum_step: 32
  max_prompts_for_generation: 50
  generation_batch_size: 3
  # VPL-GP specific parameters for conditional generation
  vpl_latent_dim: 32  # Should match selector's vpl_latent_dim
  vpl_feature_method: 'choice_logits'  # Should match selector's vpl_feature_method
  vpl_kl_weight: 0.05
  vpl_gp_temperature: 5.0  # Should match selector (Gemma Phase 5)
  adapter:
    use: True
    count: 3
expname: hhrl/rlhf_gemma/hhrl_choice_gemma_unseen_vplgp
trainer:
  type: llmdporewardtrainer
dataloader:
  batch_size: 1
  num_workers: 0
train:
  local_update_steps: 30
  batch_or_epoch: batch
  optimizer:
    type: AdamW
    betas: (0.9, 0.95)
    lr: 0.0001
  is_enable_half: True
eval:
  freq: 10
  use_gpt_api_for_winrate: true
  use_baseline_model_for_winrate: true
  metrics: ['loss', 'acc', 'helpfulness_winrate', 'harmlessness_winrate']
  best_res_update_round_wise_key: test_loss
  count_flops: False
wandb:
  use: True
  name_user: ''
  name_project: 'fvpl-unseen-rl'
  online_track: True
  client_train_info: False
