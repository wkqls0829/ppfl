name: biscuit
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9.23
  - pip
  # Note: PyTorch with CUDA must be installed separately using PyTorch index
  # Run after conda env creation:
  #   pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cu121
  - pip:
    # Core ML/DL libraries (PyTorch installed separately - see note above)
    - transformers>=4.50.0,<5.0.0
    - accelerate>=1.0.0
    - peft>=0.15.0
    - datasets>=3.0.0
    - tokenizers>=0.20.0
    - safetensors>=0.5.0
    
    # CUDA support (for CUDA 12.1) - flexible versions
    - nvidia-cublas-cu12>=12.1.0
    - nvidia-cuda-cupti-cu12>=12.1.0
    - nvidia-cuda-nvrtc-cu12>=12.1.0
    - nvidia-cuda-runtime-cu12>=12.1.0
    - nvidia-cudnn-cu12>=9.0.0
    - nvidia-cufft-cu12>=11.0.0
    - nvidia-cufile-cu12>=1.0.0
    - nvidia-curand-cu12>=10.3.0
    - nvidia-cusolver-cu12>=11.4.0
    - nvidia-cusparse-cu12>=12.1.0
    - nvidia-cusparselt-cu12>=0.7.0
    - nvidia-nccl-cu12>=2.18.0
    - nvidia-nvjitlink-cu12>=12.0.0
    - nvidia-nvtx-cu12>=12.1.0
    - triton>=3.0.0
    
    # Data processing
